<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Success</title>
<meta name="theme-color" id="themeColor" content="#111213">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Client Success">
<link rel="apple-touch-icon" href="./icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=2">
<link rel="manifest" href="./manifest.webmanifest?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe7eb;
  --ink:#10212a;
  --ink2:rgba(16,33,42,.64);
  --ink3:rgba(16,33,42,.42);
  --line:rgba(16,33,42,.08);
  --glass:rgba(255,255,255,.5);
  --glass-hi:rgba(255,255,255,.78);
  --glass-solid:rgba(250,252,253,.88);
  --edge:rgba(255,255,255,.72);
  --shadow:0 24px 60px -28px rgba(18,62,84,.35);
  --coral:#ec4a4a;
  --lime:#c6e43a;
  --good:#23936f;
  --warn:#c98317;
  --chip:rgba(16,33,42,.06);
  /* status + contact-kind hues */
  --honey:#c9921b; --sky:#2f86c9; --peri:#6c62d8; --sea:#23936f; --apricot:#df7434; --stone:#7f8b91; --blush:#d4577a;
  --b1:#3aa3c2; --b2:#8fd0e6; --b3:#f59a3a; --b4:#f6c7a0; --b5:#bcd3dc;
  --grid:rgba(255,255,255,.22);
  --r:30px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111213; --ink:#eaf2f5; --ink2:rgba(234,242,245,.68); --ink3:rgba(234,242,245,.42);
    --line:rgba(255,255,255,.08); --glass:rgba(40,41,44,.5); --glass-hi:rgba(52,53,57,.72); --glass-solid:rgba(30,31,33,.94);
    --edge:rgba(255,255,255,.12); --shadow:0 24px 60px -24px rgba(0,0,0,.6); --chip:rgba(255,255,255,.07);
    --b1:#3e4146; --b2:#55585e; --b3:#9a5420; --b4:#5e4232; --b5:#1d1e21; --grid:rgba(255,255,255,.04);
    --good:#5fd3a8; --warn:#f0b04a;
    --honey:#f0c157; --sky:#7cc0f2; --peri:#a9a2f5; --sea:#5fd3a8; --apricot:#f6a26b; --stone:#a7b3b9; --blush:#f08aa7;
  }
}
:root[data-theme="dark"]{
  --bg:#111213; --ink:#eaf2f5; --ink2:rgba(234,242,245,.68); --ink3:rgba(234,242,245,.42);
  --line:rgba(255,255,255,.08); --glass:rgba(40,41,44,.5); --glass-hi:rgba(52,53,57,.72); --glass-solid:rgba(30,31,33,.94);
  --edge:rgba(255,255,255,.12); --shadow:0 24px 60px -24px rgba(0,0,0,.6); --chip:rgba(255,255,255,.07);
  --b1:#3e4146; --b2:#55585e; --b3:#9a5420; --b4:#5e4232; --b5:#1d1e21; --grid:rgba(255,255,255,.04);
  --good:#5fd3a8; --warn:#f0b04a;
  --honey:#f0c157; --sky:#7cc0f2; --peri:#a9a2f5; --sea:#5fd3a8; --apricot:#f6a26b; --stone:#a7b3b9; --blush:#f08aa7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Urbanist,ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-weight:400;letter-spacing:.005em;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
[data-act="open"]{cursor:pointer}

/* ── backdrop ── */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,var(--b5),var(--bg) 60%)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9}
.bg .b1{width:70vw;height:70vw;right:-18vw;top:-30vw;background:radial-gradient(circle at 40% 60%,var(--b1),transparent 68%)}
.bg .b2{width:55vw;height:55vw;left:-15vw;top:-10vw;background:radial-gradient(circle,var(--b2),transparent 66%)}
.bg .b3{width:42vw;height:42vw;left:22vw;top:26vh;background:radial-gradient(circle,var(--b3),transparent 64%);opacity:.7}
.bg .b4{width:48vw;height:40vw;right:-6vw;bottom:-14vw;background:radial-gradient(circle,var(--b4),transparent 66%);opacity:.7}
.bg::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;mask-image:linear-gradient(180deg,#000 0%,transparent 55%);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 55%)}

.wrap{max-width:1360px;margin:0 auto;padding:22px 32px 140px}

/* ── glass ── */
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--shadow),inset 0 1px 0 var(--edge)}
.solid{background:var(--glass-solid)}
.round{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--ink2);transition:transform .15s,background .15s}
.round:hover{background:var(--glass-hi);transform:translateY(-1px)}
.round.sm{width:32px;height:32px}

/* ── top bar ── */
.top{display:flex;align-items:center;gap:16px;margin-bottom:34px}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:19px;letter-spacing:.01em;white-space:nowrap}
.brand .mark{width:32px;height:32px;border-radius:11px;background:radial-gradient(circle at 90% 95%,rgba(245,154,58,.75),transparent 55%),linear-gradient(140deg,#7fbdec,#b9d9ee 50%,#f1efe4);box-shadow:0 6px 14px -8px rgba(29,90,120,.5),inset 0 1px 0 rgba(255,255,255,.7);border:1px solid var(--edge);display:grid;place-items:center;color:#10212a}
.nav{margin:0 auto;display:flex;gap:6px;padding:5px;border-radius:999px}
.nav button{padding:9px 18px;border-radius:999px;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:7px;transition:background .15s,color .15s}
.nav button:hover{color:var(--ink)}
.nav button.on{background:var(--glass-solid);color:var(--ink);box-shadow:0 4px 14px -6px rgba(0,0,0,.18)}
.topr{display:flex;align-items:center;gap:10px}
.clock{padding:8px 16px;border-radius:999px;font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.clock b{font-weight:500;color:var(--ink)}
.syncbtn{position:relative}
.syncbtn i{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--ink3);border:1.5px solid var(--bg)}
.syncbtn i.ok{background:var(--good)}
.syncbtn i.pending{background:var(--warn)}
.syncbtn i.err{background:var(--coral)}
.syncbtn i.off{background:transparent;border-color:transparent}

/* ── hero ── */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:28px;align-items:end;margin-bottom:26px}
.eyebrow{font-size:12px;color:var(--ink3);letter-spacing:.04em;margin-bottom:10px}
h1{font-weight:300;font-size:clamp(40px,5.2vw,68px);line-height:1;letter-spacing:-.025em}
h1 em{font-style:normal;font-weight:400}
.heroSub{margin-top:14px;color:var(--ink2);font-size:15px}

/* fortnight strip */
.strip{padding:20px 22px 18px}
.stripH{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.stripH p{font-size:16px;font-weight:500}
.stripH span{font-size:12px;color:var(--ink3)}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:2px;text-align:center}
.days .dow{font-size:10.5px;color:var(--ink3);margin-bottom:8px}
.days .dn{width:100%;max-width:32px;aspect-ratio:1;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--ink2);position:relative}
.days .past .dn{color:var(--ink3)}
.days .mon .dn{border:1px solid var(--ink3);color:var(--ink)}
.days .today .dn{background:var(--coral);color:#fff;border:none;font-weight:500;box-shadow:0 6px 16px -6px var(--coral)}
.days .wk2{border-left:1px solid var(--line)}
.ruler{position:relative;height:22px;margin-top:14px;display:flex;justify-content:space-between;align-items:flex-end}
.ruler i{display:block;width:1px;height:8px;background:var(--ink3);opacity:.55}
.ruler i.big{height:14px;opacity:.8}
.ruler .mk{position:absolute;bottom:0;width:2px;height:22px;background:var(--coral);border-radius:2px;transform:translateX(-1px)}

/* ── stats ── */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:26px}
.stat{padding:18px 20px 18px;border-radius:26px;min-height:150px;display:flex;flex-direction:column}
.stat .lbl{font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:6px}
.stat .num{margin-top:auto;padding-top:16px;color:var(--ink);line-height:0}
.stat .num svg{display:block;max-width:100%;height:auto}
.stat .sub{font-size:11.5px;color:var(--ink3);margin-top:10px;min-height:14px}
.stat.alert .num{color:var(--coral)}
.stat.alert .lbl::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--coral);margin-top:4px}

/* ── grid + cards ── */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.s7{grid-column:span 7}.s5{grid-column:span 5}.s12{grid-column:span 12}
.card{padding:22px 22px 18px;display:flex;flex-direction:column;min-width:0}
.cardH{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cardH h2{font-size:17px;font-weight:500;letter-spacing:-.005em}
.cardH .hs{font-size:12px;color:var(--ink3);margin-top:3px}
.cardH .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);color:var(--ink2);background:var(--glass-hi);transition:background .15s,transform .15s;white-space:nowrap}
.pill:hover{transform:translateY(-1px);color:var(--ink)}
.pill.dark{background:var(--ink);color:var(--bg);border-color:transparent}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.pill.danger{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 35%,transparent)}
.chip{font-size:11px;padding:4px 9px;border-radius:999px;background:var(--chip);color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.late{color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,transparent)}
.chip.due{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.chip.ok{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 10px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:11px 6px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .main{flex:1;min-width:0}
.row .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ava{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:12.5px;font-weight:600;color:rgba(16,33,42,.72);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 14px -8px rgba(0,0,0,.3)}
.ava.sm{width:30px;height:30px;font-size:11px}
.tick{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink3);display:grid;place-items:center;color:transparent;flex-shrink:0;transition:all .15s}
.tick:hover{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.empty{padding:26px 6px;text-align:center;color:var(--ink3);font-size:13.5px}
.x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);flex-shrink:0;opacity:.6}
.x:hover{opacity:1;background:var(--chip);color:var(--coral)}

/* cycle */
.cyc{display:flex;gap:18px;align-items:flex-end;margin-bottom:14px}
.cyc .big{line-height:0;color:var(--ink)}
.cyc .meta{font-size:12.5px;color:var(--ink2);line-height:1.5;padding-bottom:2px}
.cyc .meta b{font-weight:500;color:var(--ink)}
.bar{height:6px;border-radius:6px;background:var(--chip);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--b1),var(--lime))}
.how{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--k,var(--good))}

/* boards */
.board{display:grid;gap:12px}
.board.c4{grid-template-columns:repeat(4,1fr)}
.board.c3{grid-template-columns:repeat(3,1fr)}
.col{background:var(--chip);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.colH{display:flex;align-items:center;gap:8px;padding:2px 4px 0}
.colH b{font-size:13.5px;font-weight:500}
.colH span{font-size:11.5px;color:var(--ink3)}
.colH .n{margin-left:auto;font-size:12px;color:var(--ink3)}
.colH .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.colS{font-size:11.5px;color:var(--ink3);padding:0 4px;margin-top:-6px}
.mini{background:var(--glass-solid);border-radius:18px;padding:12px;border:1px solid var(--edge);box-shadow:0 10px 24px -18px rgba(0,0,0,.4)}
.miniTop{display:flex;align-items:center;gap:10px}
.miniTop .main{flex:1;min-width:0}
.miniTop .t{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miniTop .s{font-size:11.5px;color:var(--ink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miniAct{display:flex;gap:6px;margin-top:10px}
.miniAct .pill{flex:1;justify-content:center;padding:6px 8px;font-size:12px}
.colEmpty{font-size:12px;color:var(--ink3);text-align:center;padding:14px 0}
.dayruler{position:relative;height:26px;margin:12px 2px 0;display:flex;justify-content:space-between;align-items:flex-end}
.dayruler i{width:1px;height:7px;background:var(--ink3);opacity:.45}
.dayruler i.tp{height:13px;opacity:.9;background:var(--ink2)}
.dayruler .mk{position:absolute;bottom:0;width:2px;height:24px;border-radius:2px;background:var(--coral)}
.dayruler .mk.ok{background:var(--lime)}
.drl{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);margin:4px 1px 0}

/* tasks / inline add */
.add{display:flex;gap:8px;margin-bottom:10px}
.add input{flex:1;min-width:0;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass-hi);outline:none;font-size:13.5px}
.add input:focus{border-color:var(--ink3)}
.tag{font-size:10.5px;color:var(--warn);margin-left:6px}

/* floating action */
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:10px;padding:7px;border-radius:999px;width:min(520px,calc(100vw - 32px))}
.dock .go{flex:1;display:flex;align-items:center;gap:12px;padding:6px 6px 6px 8px;border-radius:999px;background:var(--glass-solid);font-size:14px;color:var(--ink2);text-align:left}
.dock .go .ic{width:38px;height:38px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--ink)}
.dock .go .ar{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}

/* banner */
.banner{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 20px;border-radius:999px;margin-bottom:22px;font-size:13px;color:var(--ink2)}
.banner b{color:var(--ink);font-weight:500}
.banner .sp{flex:1}

/* ── clients page ── */
.pageH{display:flex;align-items:flex-end;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.pageH .sp{flex:1}
.pageH .count{font-size:15px;color:var(--ink2);margin-top:12px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;border-radius:999px;width:min(320px,100%);color:var(--ink3)}
.search input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:14px;color:var(--ink)}
.filters{display:flex;gap:4px;padding:4px;border-radius:999px;overflow-x:auto;max-width:100%}
.filters button{padding:8px 14px;border-radius:999px;font-size:13px;color:var(--ink2);white-space:nowrap;display:flex;gap:6px;align-items:center}
.filters button.on{background:var(--glass-solid);color:var(--ink);box-shadow:0 4px 14px -6px rgba(0,0,0,.18)}
.filters button span{font-size:11.5px;color:var(--ink3)}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.cc{--ink-c:#10212a;position:relative;border-radius:32px;padding:18px 18px 16px;min-height:236px;display:flex;flex-direction:column;overflow:hidden;color:var(--ink-c);
  background:linear-gradient(165deg,var(--a) 0%,var(--b) 78%);border:1px solid rgba(255,255,255,.65);
  box-shadow:0 26px 50px -30px var(--deep),inset 0 1px 0 rgba(255,255,255,.75);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;cursor:pointer;text-align:left}
.cc::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 15% -10%,rgba(255,255,255,.65),transparent 55%);pointer-events:none}
.cc::after{content:"";position:absolute;width:180px;height:180px;right:-60px;bottom:-70px;border-radius:50%;background:radial-gradient(circle,var(--deep),transparent 68%);opacity:.28;filter:blur(8px);pointer-events:none}
.cc:hover{transform:translateY(-4px);box-shadow:0 34px 60px -30px var(--deep),inset 0 1px 0 rgba(255,255,255,.75)}
.cc>*{position:relative;z-index:1}
.cc.churned{filter:saturate(.25);opacity:.75}
.ccTop{display:flex;align-items:center;gap:8px}
.gpill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);color:var(--ink-c);white-space:nowrap}
.gpill i{width:6px;height:6px;border-radius:50%;background:var(--sc,currentColor)}
.ccName{font-size:23px;font-weight:400;letter-spacing:-.015em;line-height:1.12;margin-top:16px}
.ccOwner{font-size:13px;color:rgba(16,33,42,.62);margin-top:3px}
.ccBottom{margin-top:auto;padding-top:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.ccTime small{display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(16,33,42,.6)}
.ccTime small i{width:6px;height:6px;border-radius:50%;background:rgba(16,33,42,.3)}
.ccTime small i.open{background:#23b37f;box-shadow:0 0 0 3px rgba(35,179,127,.18)}
.ccTime b{display:block;font-size:30px;font-weight:300;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.ccState{text-align:right;font-size:12px;color:rgba(16,33,42,.66);line-height:1.45;max-width:55%}
.ccState strong{display:block;font-weight:500;color:var(--ink-c);font-size:12.5px}
.ccRule{display:flex;justify-content:space-between;align-items:flex-end;height:14px;width:120px;margin:6px 0 0 auto;position:relative}
.ccRule i{width:1px;height:5px;background:rgba(16,33,42,.3)}
.ccRule i.on{height:9px;background:rgba(16,33,42,.6)}
.ccRule em{position:absolute;bottom:0;width:2px;height:14px;border-radius:2px;background:var(--coral)}
.addCard{border:1.5px dashed var(--ink3);border-radius:32px;min-height:236px;display:grid;place-items:center;color:var(--ink2);font-size:14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .2s}

.crumb{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:13px;color:var(--ink3)}

  background:linear-gradient(150deg,var(--a) 0%,var(--b) 70%);border:1px solid rgba(255,255,255,.65);box-shadow:0 34px 70px -40px var(--deep),inset 0 1px 0 rgba(255,255,255,.75);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.dHero::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 80% at 10% -20%,rgba(255,255,255,.7),transparent 55%);pointer-events:none}
.dHero::after{content:"";position:absolute;width:420px;height:420px;right:-120px;bottom:-200px;border-radius:50%;background:radial-gradient(circle,var(--deep),transparent 66%);opacity:.3;filter:blur(10px);pointer-events:none}
.dHero>*{position:relative;z-index:1}
.dHero h1{font-size:clamp(36px,4.4vw,56px);margin-top:16px}
.dHero .who{font-size:15px;color:rgba(16,33,42,.66);margin-top:10px}
.dHero .acts{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.dHero .acts .pill{background:rgba(255,255,255,.6);border-color:rgba(255,255,255,.8);color:#10212a}
.dHero .acts .pill.dark{background:#10212a;color:#fff}
.dTime{text-align:right}
.dTime small{font-size:12.5px;color:rgba(16,33,42,.6);display:flex;align-items:center;gap:7px;justify-content:flex-end}
.dTime small i{width:7px;height:7px;border-radius:50%;background:rgba(16,33,42,.3)}
.dTime small i.open{background:#23b37f;box-shadow:0 0 0 3px rgba(35,179,127,.2)}
.dTime b{display:block;font-size:64px;font-weight:300;letter-spacing:-.035em;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}

.journey{display:flex;gap:6px;flex-wrap:wrap}
.journey button{flex:1 1 auto;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:11px 14px;border-radius:18px;border:1px solid var(--line);background:var(--glass-hi);text-align:left;min-width:110px;transition:transform .15s}
.journey button:hover{transform:translateY(-1px)}
.journey button b{font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.journey button b i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.journey button span{font-size:11.5px;color:var(--ink3)}
.journey button.done{opacity:.6}
.journey button.on{background:color-mix(in srgb,var(--c) 14%,var(--glass-solid));border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.journey button.on span{color:var(--ink2)}
.jsub{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.jsub .sp{flex:1}
.jlbl{font-size:12px;color:var(--ink3);margin:16px 0 8px}

.hist{position:relative}
.histStrip{margin:2px 0 14px}
.histStrip svg{display:block;width:100%;height:44px}
.histSum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hk{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--k) 12%,transparent);color:var(--k)}
.hMonth{font-size:12px;color:var(--ink3);margin:14px 0 4px 6px}
.hItem{display:flex;gap:14px;padding:12px 6px;border-top:1px solid var(--line);align-items:flex-start}
.hItem .hic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:var(--k);background:color-mix(in srgb,var(--k) 13%,transparent)}
.hItem .main{flex:1;min-width:0}
.hItem .t{font-size:13.5px;font-weight:500}
.hItem .t span{font-weight:400;color:var(--ink3);margin-left:6px;font-size:12.5px}
.hItem .n{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{margin-bottom:12px}
.fld.full{grid-column:1/-1}
.fld label{display:block;font-size:12px;color:var(--ink3);margin-bottom:6px}
.fld select,.fld input,.fld textarea{width:100%;padding:11px 14px;border-radius:16px;border:1px solid var(--line);background:var(--glass-hi);outline:none;font-size:14px;transition:border-color .15s}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:color-mix(in srgb,var(--sky) 50%,transparent)}

.fld textarea.big{min-height:150px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--ink2);background:var(--glass-hi)}
.opts button.on{background:var(--ink);color:var(--bg);border-color:transparent}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 14px -8px rgba(0,0,0,.35)}
.swatches button.on{border-color:var(--ink);outline:2px solid var(--bg);outline-offset:-4px}

details.grp{border-top:1px solid var(--line)}
details.grp:first-of-type{border-top:none}
details.grp summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 6px;cursor:pointer;font-size:14px;font-weight:500}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary .cnt{font-size:12px;color:var(--ink3);font-weight:400}
details.grp summary .chev{margin-left:auto;color:var(--ink3);transition:transform .2s}
details.grp[open] summary .chev{transform:rotate(90deg)}
details.grp .body{padding:2px 6px 10px}


/* ── billing ── */
.monthSw{display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px}
.monthSw b{font-weight:500;font-size:15px;min-width:150px;text-align:center}
.bTop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.bTotal .num{line-height:0;margin:6px 0 14px;color:var(--ink)}
.bTotal .meta{display:flex;gap:8px;flex-wrap:wrap}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rates .fld{margin-bottom:0}

.money input{padding-left:26px!important}
.note{font-size:12px;color:var(--ink3);margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bHead,.bRow{display:grid;grid-template-columns:minmax(180px,1.6fr) repeat(3,minmax(84px,1fr)) minmax(96px,1fr) auto;gap:12px;align-items:center}
.bHead{font-size:12px;color:var(--ink3);padding:0 6px 8px}
.bHead .r,.bRow .tot{text-align:right}
.bRow{padding:10px 6px;border-top:1px solid var(--line)}
.bRow .who{display:flex;align-items:center;gap:12px;min-width:0}
.bRow .who .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bRow .who .s{font-size:11.5px;color:var(--ink3)}
.bRow input{width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--glass-hi);outline:none;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.bRow input::placeholder,.money input::placeholder{color:var(--ink3);opacity:.55}
.bRow input:focus{border-color:color-mix(in srgb,var(--sky) 50%,transparent)}
.bRow .tot{font-size:16px;font-variant-numeric:tabular-nums}
.bRow .tot.zero{color:var(--ink3)}
.bRow .acts{display:flex;gap:6px;justify-content:flex-end}
.bRow .ml{display:none;font-size:11px;color:var(--ink3);margin-bottom:4px}
.bRow.done{background:color-mix(in srgb,var(--good) 5%,transparent);border-radius:16px}
@media (max-width:900px){
  .bTop{grid-template-columns:1fr}

  .bRow{grid-template-columns:repeat(3,1fr);row-gap:10px}

  .bRow .ml{display:block}
  .bRow .tot{grid-column:1/2;text-align:left}
  .bRow .acts{grid-column:2/-1}

}

/* date picker */
.dpRow{display:flex;flex-wrap:wrap;gap:6px}
.dpRow button{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass-hi);font-size:13px;color:var(--ink2);transition:background .15s}
.dpRow button:hover{color:var(--ink)}
.dpRow button.on{background:var(--ink);color:var(--bg);border-color:transparent}
.dpRow .dpBtn.open{border-color:color-mix(in srgb,var(--sky) 55%,transparent);color:var(--ink)}
.dpRow .dpClear{padding:9px 11px}
.cal{margin-top:10px;padding:14px 14px 12px;border-radius:22px;background:var(--glass-hi);border:1px solid var(--line);box-shadow:0 18px 40px -26px rgba(0,0,0,.45);max-width:340px}
.calH{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calH b{flex:1;font-weight:500;font-size:14.5px;padding-left:4px}
.calG{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.calG span{font-size:11px;color:var(--ink3);padding:4px 0 6px}
.calG button{width:100%;max-width:38px;aspect-ratio:1;margin:0 auto;border-radius:50%;font-size:13px;color:var(--ink);display:grid;place-items:center;font-variant-numeric:tabular-nums;transition:background .12s}
.calG button:hover:not(:disabled){background:var(--chip)}
.calG button.out{color:var(--ink3)}
.calG button.today{box-shadow:inset 0 0 0 1.5px var(--coral);color:var(--coral)}
.calG button.sel{background:var(--ink);color:var(--bg);box-shadow:none}
.calG button.today.sel{background:var(--coral);color:#fff}
.calG button:disabled{opacity:.22;cursor:default}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,24,30,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;overflow-y:auto}
.scrim.fresh{animation:fade .2s ease}
.modal{width:min(480px,100%);padding:24px}
.fresh .modal{animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
.modal h3{font-size:20px;font-weight:500;margin-bottom:16px}
.mAct{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

/* toast */
.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);z-index:60;padding:10px 10px 10px 18px;border-radius:999px;display:flex;gap:12px;align-items:center;font-size:13px;animation:rise .3s ease;--tx:-50%}
.toast button{padding:6px 12px;border-radius:999px;background:var(--chip);font-size:12.5px}

/* motion */
@keyframes rise{from{opacity:0;transform:translate(var(--tx,0),14px)}to{opacity:1;transform:translate(var(--tx,0),0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.intro .in{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* responsive */
@media (max-width:1180px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero{grid-template-columns:minmax(0,1fr)}
  .board.c4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .s7,.s5{grid-column:span 12}
  .nav{display:none}
  .dHero{grid-template-columns:1fr}
  .dTime{text-align:left}.dTime small{justify-content:flex-start}
}
@media (max-width:620px){
  .wrap{padding:16px 16px 130px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{min-height:128px;padding:16px}
  .board.c4,.board.c3{grid-template-columns:1fr}
  .clock .city{display:none}
  .top{gap:8px}
  .brand{font-size:16px;gap:8px}
  .clock{padding:8px 12px}
  .days .dn{font-size:11.5px}
  .days .dow{font-size:9px}
  .strip{padding:16px 12px 14px}
  .stripH{flex-wrap:wrap}
  .banner{border-radius:24px;flex-wrap:wrap}
  .card{padding:18px 16px 14px}
  .fields{grid-template-columns:1fr}
  .dHero{padding:22px 20px}
  .dTime b{font-size:44px}
}
</style>

var INTAKE_GROUPS=[
 {id:"biz",l:"Business",fields:[

var GLYPH={

};
var dots=function(str,pitch,label){
  pitch=pitch||6;var x=0,cs=[];
  String(str).split("").forEach(function(ch){
    var g=GLYPH[ch];if(!g){x+=3;return}
    var w=g[0].length;
    g.forEach(function(row,r){for(var c=0;c<w;c++)if(row[c]==="1")cs.push('<circle cx="'+((x+c+.5)*pitch).toFixed(1)+'" cy="'+((r+.5)*pitch).toFixed(1)+'" r="'+(pitch*.36).toFixed(2)+'"/>')});
    x+=w+1;
  });
  var W=Math.max(1,(x-1)*pitch),H=7*pitch;
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" fill="currentColor" role="img" aria-label="'+esc(label||str)+'">'+cs.join("")+'</svg>';
};

var LSC="dhq2_sync",GFILE="hq.json";

var hasSync=function(){var c=loadCfg();return!!(c.token&&c.gistId)};
var syncSt="off",lastSync="",pushTimer=null,lastPull=0;
var syncTitle=function(){return{off:"Sync is off. Click to set it up",ok:"Synced"+(lastSync?" at "+lastSync:""),pending:"Syncing…",err:"Sync failed. Click to retry"}[syncSt]};

  var el=document.getElementById("syncdot");if(el){el.className=st;el.parentNode.title=syncTitle()}};
var gh=function(url,opt){var c=loadCfg();opt=opt||{};opt.headers=Object.assign({Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"},opt.headers||{});return fetch(url,opt)};
var gistPull=function(){var c=loadCfg();
  return gh("https://api.github.com/gists/"+c.gistId).then(function(r){if(!r.ok)throw new Error("Pull failed ("+r.status+")");return r.json()})
  .then(function(g){var f=g.files&&g.files[GFILE];if(!f)return null;if(f.truncated)return fetch(f.raw_url).then(function(r){return r.json()});return JSON.parse(f.content)})};
var gistPush=function(){var c=loadCfg(),files={};files[GFILE]={content:JSON.stringify(data)};
  return gh("https://api.github.com/gists/"+c.gistId,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({files:files})})
  .then(function(r){if(!r.ok)throw new Error("Push failed ("+r.status+")");return r.json()})};
var schedulePush=function(){if(mode!=="real"||!hasSync())return;setSync("pending");clearTimeout(pushTimer);pushTimer=setTimeout(doPush,2500)};
var doPush=function(){pushTimer=null;if(mode!=="real"||!hasSync())return Promise.resolve();setSync("pending");
  return gistPush().then(function(){setSync("ok")},function(){setSync("err")})};
var doPull=function(force){
  if(!hasSync()){setSync("off");return Promise.resolve(false)}
  if(pushTimer&&!force)return Promise.resolve(false); // local edits waiting to go up win
  setSync("pending");lastPull=Date.now();
  return gistPull().then(function(remote){
    if(remote&&Array.isArray(remote.clients)&&(force||mode==="demo"||(remote.updatedAt||0)>(data.updatedAt||0))){
      ls.set(LSK,JSON.stringify(remote));load();parseRoute();render();setSync("ok");return true;

};

/* ════════ derived ════════ */
var byId=function(id){return data.clients.find(function(c){return c.id===id})};
var stageDays=function(c){return c.statusSince?Math.max(0,daysBetween(c.statusSince,today())):0};
var tpState=function(c){
  var w=TPS[c.tp||0];if(!w)return null;var dl=stageDays(c);
  if(dl<w.s)return{k:"soon",t:"in "+(w.s-dl)+"d"};
  if(dl<=w.e)return{k:"due",t:"due"};
  return{k:"late",t:(dl-w.e)+"d late"};
};
var isLive=function(c){return c.status==="Active"};
var inFlow=function(c){return isLive(c)&&(c.tp||0)<TPS.length};
var isSettled=function(c){return isLive(c)&&(c.tp||0)>=TPS.length};
var agentOf=function(c){return(c.intake&&c.intake.agentName)||""};
// Dan touches base every second Monday; 28 Sep 2026 was a touch day, so 12 Oct, 26 Oct… follow.
var CYCLE_ANCHOR="2026-09-28";
var cycleStart=function(){var A=CYCLE_ANCHOR,t=today();var k=Math.floor(daysBetween(A,t)/14);return addDays(A,k*14)};
var contactsOf=function(c){return data.contacts.filter(function(x){return x.clientId===c.id}).sort(function(a,b){return b.date.localeCompare(a.date)||(b.at||0)-(a.at||0)})};
var cycleTouch=function(c){var s=cycleStart(),t=today();return contactsOf(c).find(function(x){return x.date>=s&&x.date<=t})||null};
var lastContact=function(c){return contactsOf(c)[0]||null};
var usageCost=function(u,r){return(+u.phone||0)*(+r.phone||0)+(+u.sms||0)*(+r.sms||0)+(+u.voice||0)*(+r.voice||0)};

var overview=function(){
  var t=today(),cs=cycleStart();
  var live=data.clients.filter(isLive).length;
  var onb=data.clients.filter(function(c){return PIPE.indexOf(c.status)>=0}).length;
  var withDates=data.clients.filter(function(c){return c.signedAt&&c.liveAt});
  var avg=withDates.length?Math.round(withDates.reduce(function(a,c){return a+Math.max(0,daysBetween(c.signedAt,c.liveAt))},0)/withDates.length):null;
  var lateTp=data.clients.filter(function(c){return inFlow(c)&&tpState(c).k==="late"}).length;
  var lateCyc=t>cs?data.clients.filter(function(c){return isSettled(c)&&!cycleTouch(c)}).length:0;
  var ym=prevYM(),m=data.billing.months[ym],total=0,withUse=0;
  if(m&&m.clients){var r=m.rates||data.billing.rates;Object.keys(m.clients).forEach(function(cid){var v=usageCost(m.clients[cid],r);if(v>0){total+=v;withUse++}})}
  var unsent=0;
  Object.keys(data.billing.months).forEach(function(k){var mm=data.billing.months[k];if(!mm.clients)return;var r=mm.rates||data.billing.rates;
    Object.keys(mm.clients).forEach(function(cid){var u=mm.clients[cid];if(!u.billed&&usageCost(u,r)>0)unsent++})});
  return{live:live,onb:onb,avg:avg,avgN:withDates.length,overdue:lateTp+lateCyc,lateTp:lateTp,lateCyc:lateCyc,usage:total,withUse:withUse,ym:ym,unsent:unsent};
};

var comingItems=function(){

var shiftYM=function(ym,n){var d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
var monthRates=function(ym){var m=data.billing.months[ym];return(m&&m.rates)||data.billing.rates};
var usageOf=function(ym,cid){var m=data.billing.months[ym];return(m&&m.clients&&m.clients[cid])||null};
var ensureMonth=function(ym){var b=data.billing;if(!b.months[ym])b.months[ym]={rates:clone(b.rates),clients:{}};if(!b.months[ym].clients)b.months[ym].clients={};if(!b.months[ym].rates)b.months[ym].rates=clone(b.rates);return b.months[ym]};

var billClients=function(ym){
  return data.clients.filter(function(c){

    var u=usageOf(ym,c.id);return u&&((+u.phone||0)||(+u.sms||0)||(+u.voice||0)||u.billed);
  }).sort(function(a,b){return a.name.localeCompare(b.name)});

var nextMonday=function(){var t=today(),m=mondayOnOrBefore(t);return addDays(m,7)};
var datePicker=function(id,o){
  o=o||{};var val=dpGet(id),st=dpState[id]||{},t=today();
  var month=st.month||(val||t).slice(0,7);
  var chips=(o.quick||[]).map(function(q){return'<button type="button" class="'+(val===q[1]&&!st.open?"on":"")+'" data-act="dppick" data-id="'+id+"|"+q[1]+'">'+q[0]+'</button>'}).join("");
  var isQuick=(o.quick||[]).some(function(q){return q[1]===val});
  var label=val?(isQuick&&!st.open?"Other date":fmtD(val)):(o.placeholder||"Pick a date");
  var html='<div class="dp"><div class="dpRow">'+chips+
    '<button type="button" class="dpBtn'+(st.open?" open":"")+(val&&!isQuick&&!st.open?" on":"")+'" data-act="dpopen" data-id="'+id+'">'+I.today(14)+esc(label)+'</button>'+
    (o.clearable&&val?'<button type="button" class="dpClear" data-act="dppick" data-id="'+id+'|" title="Clear" aria-label="Clear date">'+I.x(12)+'</button>':"")+'</div>';
  if(st.open){
    var first=month+"-01",start=mondayOnOrBefore(first),g="";
    ["M","T","W","T","F","S","S"].forEach(function(d){g+='<span>'+d+'</span>'});
    for(var i=0;i<42;i++){
      var d=addDays(start,i);if(i>=35&&d.slice(0,7)!==month)break;
      var cls=[d.slice(0,7)!==month?"out":"",d===t?"today":"",d===val?"sel":""].join(" ");
      var dis=(o.max&&d>o.max)||(o.min&&d<o.min);
      g+='<button type="button" class="'+cls+'"'+(dis?" disabled":"")+' data-act="dppick" data-id="'+id+"|"+d+'" aria-label="'+esc(fmtD(d))+'">'+(+d.slice(8))+'</button>';
    }
    html+='<div class="cal"><div class="calH"><b>'+esc(new Date(first+"T00:00:00").toLocaleDateString("en-AU",{month:"long",year:"numeric"}))+'</b>'+
      '<button type="button" class="round sm" data-act="dpmonth" data-id="'+id+'|-1" aria-label="Previous month">'+I.left(13)+'</button>'+
      '<button type="button" class="round sm" data-act="dpmonth" data-id="'+id+'|1" aria-label="Next month">'+I.right(13)+'</button></div>'+
      '<div class="calG">'+g+'</div></div>';
  }
  return html+'</div>';
};

/* ════════ modals ════════ */
var modal=null;
var renderModal=function(){
  if(!modal)return"";
  var fr=modal.fresh?" fresh":"";modal.fresh=false;
  var opts=data.clients.filter(function(c){return c.status!=="Churned"}).sort(function(a,b){return a.name.localeCompare(b.name)});
  var sel='<select name="client" required>'+opts.map(function(c){return'<option value="'+c.id+'"'+(c.id===modal.clientId?" selected":"")+'>'+esc(c.name)+'</option>'}).join("")+'</select>';
  var wrap=function(form,title,inner){return'<div class="scrim'+fr+'" data-act="close"><form class="glass solid modal" data-form="'+form+'" role="dialog" aria-label="'+title+'"><h3>'+title+'</h3>'+inner+'</form></div>'};
  var actions=function(lbl){return'<div class="mAct"><button type="button" class="pill" data-act="close">Cancel</button><button class="pill dark">'+lbl+'</button></div>'};
  if(modal.type==="up")return wrap("up","Add a reminder",
    '<div class="fld"><label>Client</label>'+sel+'</div><div class="fld"><label>What</label><input name="text" required placeholder="e.g. Send new holiday hours"></div>'+
    '<div class="fld"><label>When</label>'+datePicker("m:date",{min:today(),quick:[["Today",today()],["Tomorrow",addDays(today(),1)],["Next Monday",nextMonday()],["In a week",addDays(today(),7)]]})+'</div>'+actions("Add"));
  if(modal.type==="sync"){var cfg=loadCfg();return wrap("sync","Sync",
    '<p style="font-size:13px;color:var(--ink2);line-height:1.5;margin:-6px 0 14px">Keeps your Mac and phone in step through the same secret gist as the old app. Each browser needs this set up once. The token stays in this browser only.</p>'+
    '<p style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:14px"><span class="st" style="--c:'+({ok:"var(--good)",pending:"var(--warn)",err:"var(--coral)",off:"var(--stone)"}[syncSt])+'">'+esc({ok:"Synced",pending:"Syncing",err:"Sync failed",off:"Sync off"}[syncSt])+'</span>'+(syncSt==="ok"&&lastSync?'<span style="color:var(--ink3)">at '+esc(lastSync)+'</span>':"")+(mode==="demo"?'<span style="color:var(--ink3)">Showing sample clients</span>':"")+'</p>'+
    '<div class="fld"><label>GitHub token (gist scope)</label><input name="token" type="password" autocomplete="off" placeholder="github_pat_…" value="'+esc(cfg.token)+'"></div>'+
    '<div class="fld"><label>Gist ID</label><input name="gistId" autocomplete="off" placeholder="The ID from the old app\'s sync screen" value="'+esc(cfg.gistId)+'"></div>'+
    (hasSync()?'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><button type="button" class="pill good" data-act="syncnow">'+I.sync(13)+'Sync now</button><button type="button" class="pill" data-act="syncpull">Pull from gist now</button><button type="button" class="pill danger" data-act="syncoff">Turn sync off</button></div>':"")+
    actions("Save"))}
  if(modal.type==="client")return wrap("client","New client",
    '<div class="fields"><div class="fld"><label>Business name</label><input name="name" required placeholder="e.g. Perci Salon"></div><div class="fld"><label>Owner</label><input name="owner" placeholder="e.g. David"></div></div>'+
    '<div class="fld"><label>Agent name</label><input name="agent" placeholder="e.g. Cora"></div>'+
    '<div class="fld"><label>Stage</label><div class="opts">'+STATUSES.filter(function(s){return s.id!=="Churned"}).map(function(s){return'<button type="button" class="'+(modal.status===s.id?"on":"")+'" data-act="mset" data-id="status|'+s.id+'">'+s.l+'</button>'}).join("")+'</div></div>'+
    '<div class="fld"><label>Timezone</label><div class="opts">'+TZS.map(function(t){return'<button type="button" class="'+(modal.tz===t.id?"on":"")+'" data-act="mset" data-id="tz|'+t.id+'">'+t.city+'</button>'}).join("")+'</div></div>'+
    '<div class="fld"><label>Colour</label><div class="swatches">'+PALS.map(function(p){return'<button type="button" class="'+(modal.hue===p.id?"on":"")+'" style="background:linear-gradient(150deg,'+p.a+','+p.b+')" data-act="mset" data-id="hue|'+p.id+'" title="'+p.l+'" aria-label="'+p.l+'"></button>'}).join("")+'</div></div>'+
    actions("Add client"));
  return wrap("log","Log contact",
    '<div class="fld"><label>Client</label>'+sel+'</div>'+
    '<div class="fld"><label>How</label><div class="opts">'+KINDS.map(function(k){return'<button type="button" data-act="mset" data-id="kind|'+k.id+'" class="'+(modal.kind===k.id?"on":"")+'">'+kindIcon(k.id,14)+k.l+'</button>'}).join("")+'</div></div>'+
    '<div class="fld"><label>When</label>'+datePicker("m:date",{max:today(),quick:[["Today",today()],["Yesterday",addDays(today(),-1)]]})+'</div>'+
    '<div class="fld"><label>Note</label><textarea name="note" placeholder="What did you talk about?"></textarea></div>'+actions("Save"));
};

/* ════════ toast + undo ════════ */
var toast=null,toastTimer=null,undoSnap=null;
var say=function(msg,canUndo){toast={msg:msg,undo:!!canUndo};clearTimeout(toastTimer);toastTimer=setTimeout(function(){toast=null;undoSnap=null;var el=document.querySelector(".toast");if(el)el.remove()},5000)};
var renderToast=function(){return toast?'<div class="toast glass solid" role="status">'+esc(toast.msg)+(toast.undo?'<button data-act="undo">Undo</button>':"")+'</div>':""};

/* ════════ render ════════ */
var app=document.getElementById("app");
var render=function(){
  // keep anything typed in an open modal across re-renders
  var keep={};var mf=modal&&app.querySelector(".modal");
  if(mf)Array.prototype.forEach.call(mf.querySelectorAll("[name]"),function(el){keep[el.name]=el.value});
  var page;
  if(route.page==="clients"&&route.id)page=pageClient(byId(route.id));
  else if(route.page==="clients")page=pageClients();
  else if(route.page==="billing")page=pageBilling();
  else if(route.page==="todos")page=pageSoon("To-dos","Your internal board");
  else page=pageToday();
  app.innerHTML='<div class="wrap">'+renderTop()+page+'</div>'+renderDock()+renderModal()+renderToast();
  var nf=modal&&app.querySelector(".modal");
  if(nf)Object.keys(keep).forEach(function(k){var el=nf.querySelector('[name="'+k+'"]');if(el)el.value=keep[k]});
};
var intro=function(){document.body.classList.add("intro");clearTimeout(intro.t);intro.t=setTimeout(function(){document.body.classList.remove("intro")},1400)};

/* ════════ actions ════════ */
var commit=function(fn,msg,canUndo){undoSnap=canUndo?clone(data):null;fn(data);save();if(msg)say(msg,canUndo);render()};
var logContact=function(d,cid,date,kind,note){d.contacts.push({id:uid(),clientId:cid,date:date,kind:kind,note:note||"",at:Date.now()})};
var setStatus=function(c,s){
  if(s===c.status)return;
  c.status=s;c.statusSince=today();
  if(s==="Active"){c.tp=0;if(!c.liveAt)c.liveAt=today()}
};
var copyText=function(txt,msg){
  var done=function(){say(msg);render()};
  var fallback=function(){var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}ta.remove();done()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fallback);else fallback();
};
var act={
  tick:function(id){var c=byId(id);if(!c||!inFlow(c))return;var w=TPS[c.tp||0];
    commit(function(d){logContact(d,id,today(),w.kind,w.note);c.tp=Math.min(TPS.length,(c.tp||0)+1)},
      (c.tp||0)+1>=TPS.length?c.name+" is settled into the fortnightly cycle":w.l+" done for "+c.name,true)},
  back:function(id){var c=byId(id);if(!c)return;commit(function(){if((c.tp||0)>0)c.tp--;else{c.status="Forwarding";c.statusSince=today();delete c.liveAt}},"Moved "+c.name+" back",true)},
  chase:function(id){var c=byId(id);if(!c)return;commit(function(){c.lastNudge=today()},"Chased "+c.name,true)},
  adv:function(id){var c=byId(id);if(!c)return;var i=PIPE.indexOf(c.status);if(i<0)return;
    commit(function(){setStatus(c,i===PIPE.length-1?"Active":PIPE[i+1])},i===PIPE.length-1?c.name+" is live 🎉":c.name+" moved to "+stMeta(PIPE[i+1]).l.toLowerCase(),true)},
  backstage:function(id){var c=byId(id);if(!c)return;var i=PIPE.indexOf(c.status);if(i<=0)return;commit(function(){setStatus(c,PIPE[i-1])},"Moved "+c.name+" back",true)},
  setstatus:function(s){var c=byId(route.id);if(!c||c.status===s)return;commit(function(){setStatus(c,s)},c.name+" → "+stMeta(s).l,true)},
  settp:function(i){var c=byId(route.id);if(!c)return;commit(function(){c.tp=+i},null,false)},
  updone:function(id){var p=id.split("|"),c=byId(p[0]);if(!c)return;commit(function(){c.upcoming.forEach(function(u){if(u.id===p[1])u.done=true})},"Done",true)},
  delup:function(id){var p=id.split("|"),c=byId(p[0]);if(!c)return;commit(function(){c.upcoming=c.upcoming.filter(function(u){return u.id!==p[1]})},"Reminder deleted",true)},
  taskdone:function(id){commit(function(d){d.tasks=d.tasks.filter(function(x){return x.id!==id});var k=today();d.doneLog[k]=(d.doneLog[k]||0)+1},"To-do cleared",true)},
  delcontact:function(id){commit(function(d){d.contacts=d.contacts.filter(function(x){return x.id!==id})},"Entry deleted",true)},
  delteam:function(i){var c=byId(route.id);if(!c)return;commit(function(){c.team.splice(+i,1)},"Removed from team",true)},
  settz:function(id){var c=byId(route.id);if(!c)return;commit(function(){c.tz=id})},
  sethue:function(id){var c=byId(route.id);if(!c)return;commit(function(){c.hue=id})},
  delclient:function(id){var c=byId(id);if(!c)return;if(!confirm("Delete "+c.name+"? Their contact history goes too."))return;
    commit(function(d){d.clients=d.clients.filter(function(x){return x.id!==id});d.contacts=d.contacts.filter(function(x){return x.clientId!==id});d.tasks.forEach(function(t){if(t.clientId===id)t.clientId=""})},c.name+" deleted",true);go("#/clients")},
  copyintake:function(id){var c=byId(id);if(!c)return;copyText(intakeText(c),"Intake copied for "+c.name)},
  ym:function(v){ui.ym=v==="last"?prevYM():shiftYM(ui.ym,+v);render()},
  billed:function(cid){var ym=ui.ym,c=byId(cid);commit(function(){var m=ensureMonth(ym);m.clients[cid]=Object.assign({},m.clients[cid]||{});m.clients[cid].billed=!m.clients[cid].billed},
    (usageOf(ym,cid)||{}).billed?"Marked "+(c?c.name:"")+" not invoiced":(c?c.name:"")+" invoiced",true)},
  resetrates:function(){commit(function(d){if(d.billing.months[ui.ym])d.billing.months[ui.ym].rates=clone(d.billing.rates)},"Using current defaults")},
  copybill:function(cid){var c=byId(cid);if(!c)return;copyText(breakdown(ui.ym,c),"Breakdown copied for "+c.name)},
  sync:function(){modal={type:"sync",fresh:true};render()},
  syncnow:function(){modal=null;render();doPull(false).then(function(pulled){if(!pulled&&mode==="real")doPush().then(function(){say(syncSt==="ok"?"Synced":"Sync failed. Check the token and gist ID");render()});else{say(pulled?"Pulled your latest data":"Sync failed. Check the token and gist ID");render()}})},
  syncpull:function(){if(!confirm("Replace what's in this browser with the copy in your gist?"))return;modal=null;doPull(true).then(function(ok){say(ok?"Pulled from your gist":"Couldn't pull from the gist");render()})},
  syncoff:function(){ls.set(LSC,JSON.stringify({token:"",gistId:""}));modal=null;setSync("off");say("Sync turned off");render()},
  dpopen:function(id){var st=dpState[id]=dpState[id]||{};st.open=!st.open;if(st.open)st.month=(dpGet(id)||today()).slice(0,7);render()},
  dpmonth:function(v){var p=v.split("|"),st=dpState[p[0]]=dpState[p[0]]||{};st.month=shiftYM(st.month||(dpGet(p[0])||today()).slice(0,7),+p[1]);render()},
  dppick:function(v){var i=v.lastIndexOf("|"),id=v.slice(0,i),d=v.slice(i+1);dpState[id]={open:false};dpSet(id,d||null)},
  log:function(id){dpState={};modal={type:"log",clientId:id||null,kind:"text",date:today(),fresh:true};render();var f=app.querySelector(".modal textarea");if(f&&id)f.focus()},
  addup:function(id){dpState={};modal={type:"up",clientId:id||null,date:today(),fresh:true};render();var f=app.querySelector('.modal [name="text"]');if(f)f.focus()},
  newclient:function(){modal={type:"client",status:"Onboarding",tz:"qld",hue:null,fresh:true};render();var f=app.querySelector('.modal [name="name"]');if(f)f.focus()},
  mset:function(v){if(!modal)return;var p=v.split("|");modal[p[0]]=modal[p[0]]===p[1]&&p[0]==="hue"?null:p[1];render()},
  close:function(){modal=null;render()},
  undo:function(){if(!undoSnap)return;data=undoSnap;undoSnap=null;save();toast=null;parseRoute();render()},
  scrollcycle:function(){var el=document.getElementById("cycle");if(el)el.scrollIntoView({behavior:"smooth",block:"center"})},
  open:function(id){go("#/clients/"+encodeURIComponent(id))},
  nav:function(h){go(h)},
  flt:function(id){ui.flt=id;render()},
  theme:function(){var r=document.documentElement,cur=r.getAttribute("data-theme"),dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
    var nx=dark?"light":"dark";r.setAttribute("data-theme",nx);ls.set("hq3_theme",nx);syncChrome()},
  "import":function(){document.getElementById("importFile").click()}
};

app.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.getAttribute("data-act");
  if(a==="close"&&el.classList.contains("scrim")&&e.target!==el)return;
  if(act[a]){e.preventDefault();act[a](el.getAttribute("data-id"))}
});
app.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("cc")){e.preventDefault();act.open(e.target.getAttribute("data-id"))}
});
app.addEventListener("toggle",function(e){var g=e.target.getAttribute&&e.target.getAttribute("data-grp");if(g)openGroups[g]=e.target.open},true);
app.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==="csearch"){ui.q=el.value;document.getElementById("cgrid").innerHTML=renderClientGrid();return}
  var uk=el.getAttribute("data-use"),rk=el.getAttribute("data-rate");
  if(uk||rk){
    var ym=ui.ym;
    if(uk){var cid=el.closest(".bRow").getAttribute("data-cid"),m=ensureMonth(ym);m.clients[cid]=Object.assign({},m.clients[cid]||{});m.clients[cid][uk]=el.value}
    else{var mm=data.billing.months[ym];if(mm&&mm.rates)mm.rates[rk]=el.value;else data.billing.rates[rk]=el.value}
    var r=monthRates(ym);
    billClients(ym).forEach(function(c){var t=usageCost(usageOf(ym,c.id)||{},r),cell=document.getElementById("tot-"+c.id);if(cell){cell.textContent=money(t);cell.classList.toggle("zero",!(t>0))}});
    var sum=document.getElementById("bsum");if(sum)sum.innerHTML=renderBillSummary(ym);
    saveSoon();return;
  }
  var f=el.getAttribute("data-field");if(!f)return;
  var c=byId(route.id);if(!c)return;
  if(f.indexOf("intake.")===0){c.intake=c.intake||{};c.intake[f.slice(7)]=el.value}
  else if(f==="name"){if(el.value.trim()){c.name=el.value;var h=app.querySelector(".dHero h1");if(h)h.textContent=c.name}}
  else if(f==="signedAt"||f==="liveAt"){if(el.value)c[f]=el.value;else delete c[f]}
  else c[f]=el.value;
  saveSoon();
});
app.addEventListener("submit",function(e){
  var f=e.target,k=f.getAttribute("data-form");e.preventDefault();
  if(k==="task"){var v=f.title.value.trim();if(!v)return;commit(function(d){d.tasks.push({id:uid(),title:v,col:"todo",due:"",clientId:"",note:"",ord:Date.now(),created:today()})});
    var inp=app.querySelector('form[data-form="task"] input');if(inp)inp.focus();return}
  if(k==="team"){var c0=byId(route.id),nm=f.name.value.trim();if(!c0||!nm)return;
    commit(function(){c0.team.push({name:nm,role:f.role.value.trim(),notes:f.notes.value.trim()})});var ti=app.querySelector('form[data-form="team"] input');if(ti)ti.focus();return}
  if(k==="log"){var cid=f.client.value,c=byId(cid),kind=modal.kind,date=modal.date||today(),note=f.note.value.trim();modal=null;
    commit(function(d){logContact(d,cid,date,kind,note);if(c&&PIPE.indexOf(c.status)>=0&&(!c.lastNudge||date>c.lastNudge))c.lastNudge=date},kindOf(kind).l+" logged for "+(c?c.name:"client"),true);return}
  if(k==="up"){var c2=byId(f.client.value),txt=f.text.value.trim(),dt=modal.date||today();if(!txt||!c2)return;modal=null;
    commit(function(){c2.upcoming.push({id:uid(),date:dt,text:txt,done:false})},"Reminder added",true);return}
  if(k==="sync"){ls.set(LSC,JSON.stringify({token:f.token.value.trim(),gistId:f.gistId.value.trim()}));modal=null;render();
    doPull(false).then(function(pulled){say(pulled?"Synced. Pulled your latest data":syncSt==="err"?"Couldn't reach the gist. Check the token and ID":"Sync is on");if(!pulled&&mode==="real")doPush();render()});return}
  if(k==="client"){var name=f.name.value.trim();if(!name)return;var m=modal,id=uid();modal=null;
    commit(function(d){var nc={id:id,name:name,owner:f.owner.value.trim(),status:"Onboarding",statusSince:today(),signedAt:today(),lastNudge:null,tp:0,tz:m.tz||"qld",hue:m.hue||null,
      phone:"",email:"",keyDetails:"",team:[],upcoming:[],intake:{agentName:f.agent.value.trim()}};setStatus(nc,m.status||"Onboarding");d.clients.push(nc)},name+" added",true);
    go("#/clients/"+id)}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&modal){modal=null;render()}});

document.getElementById("importFile").addEventListener("change",function(e){
  var file=e.target.files&&e.target.files[0];if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);if(d&&d.data&&d.data.clients)d=d.data;
      if(!d||!Array.isArray(d.clients))throw new Error("no clients");
      if(mode==="real"&&!confirm("Replace the data in this browser with this backup?"))return;
      ls.set(LSK,JSON.stringify(d));load();parseRoute();schedulePush();say("Loaded "+data.clients.length+" clients from your backup");render();
    }catch(err){say("That file doesn't look like a backup from the old app");render()}
  };
  rd.readAsText(file);e.target.value="";
});

/* ════════ boot ════════ */
var isDark=function(){var t=document.documentElement.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
var syncChrome=function(){var m=document.getElementById("themeColor");if(m)m.setAttribute("content",isDark()?"#111213":"#dfe7eb")};
var th=ls.get("hq3_theme");if(th)document.documentElement.setAttribute("data-theme",th);
syncChrome();
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncChrome)}catch(e){}
load();parseRoute();render();intro();
doPull(false);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&Date.now()-lastPull>60000)doPull(false)});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(function(){});
window.addEventListener("hashchange",function(){modal=null;dpState={};parseRoute();render();intro();window.scrollTo(0,0)});
setInterval(function(){
  var el=document.getElementById("clk");if(el)el.textContent=tzTime("Australia/Hobart");
  Array.prototype.forEach.call(document.querySelectorAll("[data-tz]"),function(b){b.textContent=tzTime(b.getAttribute("data-tz"))});
},20000);

setInterval(function(){if(today()!==lastDay){lastDay=today();render()}},60000);
window.addEventListener("storage",function(e){if(e.key===LSK||e.key===DEMO_K){load();parseRoute();render()}});
})();
